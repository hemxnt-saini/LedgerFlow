<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LedgerFlow">
  <!--
    The in-app brand mark, at favicon size.

    Two unequal bars: a debit and a credit, the pair every journal entry is
    made of. A monogram would be unreadable at 16px and says nothing about
    what the product is; two bars stay legible when the tab strip shrinks
    them, and the gradient is the same one the header logo uses.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c53d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <rect x="16" y="22" width="32" height="7" rx="3.5" fill="#fff"/>
  <rect x="16" y="35" width="20" height="7" rx="3.5" fill="#fff" opacity="0.72"/>
</svg>
