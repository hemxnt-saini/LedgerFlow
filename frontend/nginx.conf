server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep the host and port the browser actually used. Without this nginx builds
  # an absolute Location from server_name and the :8080 is lost.
  absolute_redirect off;

  # The monitors used to be two static files. Those URLs are in the demo notes
  # and in people's bookmarks, so they redirect rather than 404. /index.html is
  # deliberately not redirected here - try_files below falls back to that exact
  # file, so a redirect on it would loop. The router sends it to / instead.
  location = /dev.html    { return 301 /pipeline; }
  location = /stream.html { return 301 /kafka; }

  # Hashed asset filenames are immutable, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path is handled by the router, so deep links
  # like /kafka must return index.html instead of 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
