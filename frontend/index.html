<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="LedgerFlow - an event-driven payments platform with a double-entry ledger, a saga, and controls you can watch working." />
    <!-- Matches the surface colour in each theme, so the browser chrome on
         mobile does not sit as a bright strip above a dark page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12161f" />
    <title>Wallet · LedgerFlow</title>
  </head>
  <body>
    <script>
      // Runs before the bundle parses: a dark-mode user must not see a white
      // page flash while React boots.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
